[project]
name = "reactiviq-backend"
version = "0.1.0"
description = "ReactivIQ — AI-powered CRM reactivation platform backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",

    # Pydantic
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Auth / HTTP
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",

    # AI / LLM
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0",
    "cohere>=5.0.0",
    "openai>=1.60.0",
    "ragas>=0.2.0",
    "tiktoken>=0.8.0",

    # Celery
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "flower>=2.0.1",

    # Integrations
    "hubspot-api-client>=10.0.0",
    "resend>=2.0.0",
    "twilio>=9.4.0",

    # Logging & observability
    "structlog>=24.4.0",
    "rich>=13.9.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "tenacity>=9.0.0",
    "anyio>=4.7.0",
    "orjson>=3.10.0",
    "python-slugify>=8.0.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-dateutil>=2.9.0",
    "sqlalchemy[mypy]>=2.0.36",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
